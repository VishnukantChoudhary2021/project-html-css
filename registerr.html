

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>

    <nav class="navbar">
        <h2>Student Portal</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#about">About Us</a>
            <a href="index.html#courses">Courses</a>
            <a href="index.html#contact">Contact Us</a>
            <a href="registration.html">Registration</a>
        </div>
    </nav>

    <div class="container">

        <h1>Student Registration Form</h1>
        <p>Fill in your details below.</p>

        <form action="#" method="post" enctype="multipart/form-data">

            <table>
                <tr>
                    <td><label for="name">Full Name:</label></td>
                    <td>
                        <input type="text" id="name" name="name"
                        placeholder="Enter your full name"
                        minlength="3" maxlength="50" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>
                        <input type="email" id="email" name="email"
                        placeholder="Enter your email" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="password">Password:</label></td>
                    <td>
                        <input type="password" id="password" name="password"
                        minlength="8" maxlength="20" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="confirm">Confirm Password:</label></td>
                    <td>
                        <input type="password" id="confirm" name="confirm"
                        minlength="8" maxlength="20" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="mobile">Mobile Number:</label></td>
                    <td>
                        <input type="tel" id="mobile" name="mobile"
                        placeholder="Enter 10 digit number"
                        pattern="[0-9]{10}" maxlength="10" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" name="dob" required>
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <div class="options">
                            <label><input type="radio" name="gender"
                            value="Male" required> Male</label>

                            <label><input type="radio" name="gender"
                            value="Female"> Female</label>

                            <label><input type="radio" name="gender"
                            value="Other"> Other</label>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td><label for="photo">Profile Photo:</label></td>
                    <td>
                        <input type="file" id="photo" name="photo"
                        accept="image/*" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="qualification">Qualification:</label></td>
                    <td>
                        <select id="qualification" name="qualification" required>
                            <option value="">Select Qualification</option>
                            <option value="10th">10th</option>
                            <option value="12th">12th</option>
                            <option value="graduate">Graduate</option>
                            <option value="postgraduate">Postgraduate</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="course">Course:</label></td>
                    <td>
                        <select id="course" name="course" required>
                            <option value="">Select Course</option>
                            <option value="java">Java Programming</option>
                            <option value="python">Python Programming</option>
                            <option value="web">Web Development</option>
                            <option value="data">Data Science</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="address">Address:</label></td>
                    <td>
                        <textarea id="address" name="address"
                        rows="4" maxlength="200"
                        placeholder="Enter your address"></textarea>
                    </td>
                </tr>

                <tr>
                    <td><label for="website">Website URL:</label></td>
                    <td>
                        <input type="url" id="website" name="website"
                        placeholder="https://example.com">
                    </td>
                </tr>

                <tr>
                    <td><label for="joining">Joining Date:</label></td>
                    <td>
                        <input type="date" id="joining" name="joining"
                        min="2026-01-01" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="skills">Skills Level:</label></td>
                    <td>
                        <input type="range" id="skills" name="skills"
                        min="0" max="10" value="5">
                    </td>
                </tr>

                <tr>
                    <td><label for="color">Favorite Color:</label></td>
                    <td>
                        <input type="color" id="color" name="color"
                        value="#2563eb">
                    </td>
                </tr>

                <tr>
                    <td>Terms and Conditions:</td>
                    <td>
                        <label>
                            <input type="checkbox" name="terms" required>
                            I accept the Terms and Conditions
                        </label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="button-cell">
                        <button type="submit">Submit</button>
                        <button type="reset" class="reset-btn">Reset</button>
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>
</html>
